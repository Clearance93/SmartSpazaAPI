name: CI

on:
  push:
    branches: [ master, main, Availability ]
  pull_request:

jobs:
  build-test:
    name: Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore SmartSpazaAPI.slnx

      - name: Dependency audit
        run: dotnet list SmartSpazaAPI.slnx package --vulnerable --include-transitive

      - name: Build
        run: dotnet build SmartSpazaAPI.slnx -c Release --no-restore -warnaserror

      - name: Test
        run: dotnet test SmartSpazaAPI.Tests/SmartSpazaAPI.Tests.csproj -c Release --no-build

  secret-scan:
    name: Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_CONFIG: .gitleaks.toml

  container:
    name: Container Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build image
        run: docker build -t smartspaza-api:ci .
