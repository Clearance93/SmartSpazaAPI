name: Deploy API

on:
  push:
    branches: [master, Availability]
  workflow_dispatch:

concurrency:
  group: deploy-api
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Publish API
        run: dotnet publish SmartSpazaAPI/SmartSpazaAPI.csproj -c Release -o publish

      - name: Install lftp
        run: sudo apt-get update -qq && sudo apt-get install -y -qq lftp

      - name: Put the site in maintenance mode
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          printf '<!doctype html><h1>Smart Spaza is updating…</h1><p>Please try again in a minute.</p>' > app_offline.htm
          lftp -c "set ftp:ssl-allow no; set ftp:passive-mode true; open -u '${FTP_USER}','${FTP_PASSWORD}' ${FTP_HOST}; put app_offline.htm -o /wwwroot/app_offline.htm"

      - name: Upload published files (keeps the UI intact)
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "set ftp:ssl-allow no; set ftp:passive-mode true; set mirror:parallel-transfer-count 4; open -u '${FTP_USER}','${FTP_PASSWORD}' ${FTP_HOST}; mirror -R --no-perms --no-symlinks --exclude-glob appsettings.Production.json --exclude-glob wwwroot ./publish /wwwroot"

      - name: Bring the site back online
        if: always()
        env:
          FTP_HOST: ${{ secrets.FTP_HOST }}
          FTP_USER: ${{ secrets.FTP_USER }}
          FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
        run: |
          lftp -c "set ftp:ssl-allow no; set ftp:passive-mode true; open -u '${FTP_USER}','${FTP_PASSWORD}' ${FTP_HOST}; rm -f /wwwroot/app_offline.htm"

      - name: Smoke test
        run: |
          for i in 1 2 3 4 5; do
            code=$(curl -s -o /dev/null -w '%{http_code}' http://smartspaza-api.runasp.net/health || true)
            echo "attempt $i -> $code"
            [ "$code" = "200" ] && exit 0
            sleep 10
          done
          echo "health check did not come back up"
          exit 1
